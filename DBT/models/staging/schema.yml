version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Delivered', 'Shipped', 'Cancelled', 'Returned']

  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
